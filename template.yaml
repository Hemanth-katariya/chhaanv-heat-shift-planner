AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Chhaanv - heat-safe shift planner for construction crews

Parameters:
  BedrockModelId:
    Type: String
    Default: apac.amazon.nova-lite-v1:0
    Description: Bedrock model or inference profile the Strands agent uses to word the briefing
  UseCloudFront:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Put CloudFront in front of the app (new AWS accounts must be verified by AWS Support first)

Conditions:
  WithCloudFront: !Equals [!Ref UseCloudFront, "true"]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    MemorySize: 512
    Timeout: 29
    CodeUri: backend/
    Layers:
      - !Ref DependenciesLayer
    Environment:
      Variables:
        SITES_TABLE: !Ref SitesTable
        WEB_BUCKET: !Ref WebBucket
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        USE_AGENT: "1"
        USE_POLLY: "1"

Resources:
  SitesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # Filled by the uv command in the README, so it builds on Windows without Docker.
  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layer/
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [x86_64]

  HttpApi:
    Type: AWS::Serverless::HttpApi

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.api_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SitesTable
        - S3ReadPolicy:
            BucketName: !Ref WebBucket
        - Statement:
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: "*"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi

  DailyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.daily_handler
      Timeout: 300
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SitesTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
      Events:
        FiveAmIndia:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 5 * * ? *)
            ScheduleExpressionTimezone: Asia/Kolkata

  WebBucket:
    Type: AWS::S3::Bucket

  WebBucketPolicy:
    Condition: WithCloudFront
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  OriginAccessControl:
    Condition: WithCloudFront
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Condition: WithCloudFront
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig: {}
          - Id: api
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader

Outputs:
  AppUrl:
    Value: !If
      - WithCloudFront
      - !Sub https://${Distribution.DomainName}
      - !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  WebBucketName:
    Value: !Ref WebBucket
